<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Flask Application{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('main') }}">Flask Application</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{{ url_for('main') }}">Головна</a>
        <a class="nav-link" href="{{ url_for('home') }}">Homepage</a>
        <a class="nav-link" href="{{ url_for('users.greetings', name='guest') }}">Users</a>
        <a class="nav-link" href="{{ url_for('products.all_products') }}">Товари</a>
      </div>
    </div>
  </nav>

  <main class="container my-3">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">&copy; 2026 Лабораторна робота №3</div>
  </footer>
</body>
</html>
