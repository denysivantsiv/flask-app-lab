{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-3">
    <div class="card p-3 shadow-sm border-0 mb-3">
      <h5>Навігація</h5>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link px-0" href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-0" href="{{ url_for('users.admin') }}">Admin</a>
        </li>
      </ul>
    </div>
  </div>

  <div class="col-md-9">
    <div class="card p-4 shadow-sm border-0">
      <h2 class="display-6">Hello :)</h2>
      <p class="fs-4 mb-1">User: <strong>{{ name }}</strong></p>
      {% if age %}
        <p class="text-success fs-5">Age: {{ age }}</p>
      {% else %}
        <p class="text-danger fs-5">Age: Not provided</p>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
