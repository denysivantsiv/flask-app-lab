{% extends 'base.html' %}

{% block title %}Список товарів{% endblock %}

{% block content %}
<h2 class="mb-4 text-primary">Каталог товарів</h2>
<div class="row g-3">
  {% for product in products %}
    <div class="col-md-4">
      <div class="card h-100 shadow-sm border-0 p-3">
        <h5 class="card-title fw-bold">{{ product.name }}</h5>
        <h6 class="text-success">${{ product.price }}</h6>
        <p class="card-text text-secondary small">{{ product.content[:70] }}...</p>
        <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-outline-primary mt-auto">Детальніше</a>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
